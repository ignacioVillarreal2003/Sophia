<div class="cw app-container">
  <app-page-header [title]="'documentWorkspace.create.title' | t" backLink="..">
    <app-button variant="dark" [loading]="loading()" (click)="submit()">{{ 'documentWorkspace.create.title' | t }}</app-button>
  </app-page-header>

  <!-- How it will look in the list, on its own -->
  <app-card class="cw__card">
    <div class="cw__preview" aria-hidden="true">
      <app-workspace-logo class="cw__preview-mark" [pattern]="color()" [size]="80" />
      <span class="cw__preview-text">
        <span class="cw__preview-name" [class.cw__preview-name--empty]="!draft().name">
          {{ draft().name || ('documentWorkspace.namePlaceholder' | t) }}
        </span>
        @if (draft().description) {
          <span class="cw__preview-desc">{{ draft().description }}</span>
        }
      </span>
    </div>
  </app-card>

  <!-- What to fill in -->
  <app-card class="cw__card">
    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="cw__field">
        <app-text-field
          formControlName="name"
          [label]="'documentWorkspace.name' | t"
          [placeholder]="'documentWorkspace.namePlaceholder' | t"
          [invalid]="!!errorOf('name')"
          [error]="errorOf('name') ?? ''"
          required
        />
      </div>

      <div class="cw__field">
        <app-textarea
          formControlName="description"
          [label]="'documentWorkspace.description' | t"
          [rows]="3"
          [placeholder]="'documentWorkspace.descriptionPlaceholder' | t"
        />
      </div>

      <div class="cw__field">
        <label class="cw__label">{{ 'documentWorkspace.patternLabel' | t }}</label>
        <div class="cw__patterns" role="radiogroup">
          @for (p of patterns; track p.id) {
            <button
              type="button"
              role="radio"
              class="cw__pattern"
              [class.cw__pattern--on]="color() === p.id"
              [attr.aria-label]="p.id"
              [attr.aria-checked]="color() === p.id"
              (click)="color.set(p.id)"
            >
              <app-workspace-logo [pattern]="p.id" [size]="72" />
            </button>
          }
        </div>
      </div>
    </form>
  </app-card>
</div>
