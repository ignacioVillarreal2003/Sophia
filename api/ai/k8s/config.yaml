apiVersion: v1
kind: ConfigMap
metadata:
  name: sophia-ai-config
  labels:
    app.kubernetes.io/name: sophia-ai
data:
  SERVER_PORT: "8083"
  DB_URL: jdbc:postgresql://sophia-postgres:5432/sophia_ai?sslmode=require
  DB_POOL_SIZE: "20"
  REDIS_HOST: sophia-redis
  REDIS_PORT: "6379"
  REDIS_SSL: "true"
  AI_PROVIDER: gemini
  GEMINI_MODEL: gemini-3.6-flash
  GEMINI_API_BASE_URL: https://generativelanguage.googleapis.com/v1beta
  AI_ENABLED: "true"
  AI_DAILY_TOKENS_PER_USER: "400000"
  AI_DAILY_TOKENS_PER_WORKSPACE: "2000000"
  AI_MAX_CONCURRENT_PER_USER: "2"
  AI_RATE_LIMIT_REQUESTS: "20"
  WORKSPACE_API_URL: http://sophia-document-workspace:8081
  CORS_ALLOWED_ORIGINS: https://app.sophia.example
  JWT_JSON_WEB_KEY_SET_URI: http://sophia-authentication:8080/.well-known/json-web-key-set.json
  JWT_ISSUER: sophia-authentication
  OTLP_TRACING_ENDPOINT: http://otel-collector:4318/v1/traces
  TRACING_SAMPLING_PROBABILITY: "0.1"
  RATE_LIMIT_REQUESTS: "300"
  SHUTDOWN_TIMEOUT: 80s
  SWAGGER_ENABLED: "false"
---
apiVersion: v1
kind: Secret
metadata:
  name: sophia-ai-secrets
  labels:
    app.kubernetes.io/name: sophia-ai
type: Opaque
stringData:
  DB_USERNAME: replace-me
  DB_PASSWORD: replace-me
  REDIS_PASSWORD: replace-me
  # The only secret of the AI provider. Without it the service runs and answers AI_NOT_CONFIGURED.
  GEMINI_API_KEY: replace-me
  MONITORING_PASSWORD: replace-me
