global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['sophia-alertmanager:9093']

scrape_configs:
  - job_name: authentication
    metrics_path: /actuator/prometheus
    basic_auth:
      username: prometheus
      password: prometheus
    static_configs:
      - targets: ['sophia-authentication-api:8080']
        labels:
          service: authentication

  - job_name: document-workspace
    metrics_path: /actuator/prometheus
    basic_auth:
      username: prometheus
      password: prometheus
    static_configs:
      - targets: ['sophia-document-workspace-api:8081']
        labels:
          service: document-workspace

  - job_name: notification
    metrics_path: /actuator/prometheus
    basic_auth:
      username: prometheus
      password: prometheus
    static_configs:
      - targets: ['sophia-notification-api:8082']
        labels:
          service: notification
