name: sophia-authentication

services:
  authentication-api:
    image: ${AUTHENTICATION_IMAGE:-sophia-authentication:local}
    build: ../authentication
    container_name: sophia-authentication-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - path: ../authentication/.env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_URL: jdbc:postgresql://${POSTGRES_HOST:-sophia-postgres}:${POSTGRES_PORT:-5432}/${AUTHENTICATION_DB:-sophia_authentication}
      DB_USERNAME: ${POSTGRES_USER:-sophia}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-sophia}
      REDIS_HOST: ${REDIS_HOST:-sophia-redis}
      REDIS_PORT: "${REDIS_PORT:-6379}"
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-sophia-kafka:9092}
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      KAFKA_TOPIC_REPLICAS: "${KAFKA_TOPIC_REPLICAS:-1}"
      USER_EVENTS_ENABLED: ${USER_EVENTS_ENABLED:-true}
      USER_EVENTS_TOPIC: ${USER_EVENTS_TOPIC:-sophia.authentication.user-events}
      USER_EVENTS_PARTITIONS: "${USER_EVENTS_PARTITIONS:-3}"
      NOTIFICATIONS_ENABLED: ${NOTIFICATIONS_ENABLED:-true}
      NOTIFICATION_COMMANDS_TOPIC: ${NOTIFICATION_COMMANDS_TOPIC:-sophia.notifications.commands}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://sophia-minio:9000}
      S3_BUCKET: ${AUTHENTICATION_S3_BUCKET:-sophia-avatars}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      JWT_ISSUER: ${JWT_ISSUER:-sophia-authentication}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:3000}
      TRACING_ENABLED: ${TRACING_ENABLED:-true}
      OTLP_ENDPOINT: ${OTLP_ENDPOINT:-http://sophia-tempo:4318/v1/traces}
      MONITORING_USERNAME: ${MONITORING_USERNAME:-prometheus}
      MONITORING_PASSWORD: ${MONITORING_PASSWORD:-prometheus}
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 1024M
        reservations:
          memory: 512M
    networks:
      - sophia

networks:
  sophia:
    external: true
