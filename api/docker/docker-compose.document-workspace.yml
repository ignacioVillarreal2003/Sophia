name: sophia-document-workspace

services:
  document-workspace-api:
    build: ../document-workspace
    container_name: sophia-document-workspace-api
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: "8081"
      DB_URL: jdbc:postgresql://${POSTGRES_HOST:-sophia-postgres}:${POSTGRES_PORT:-5432}/${DOCUMENT_WORKSPACE_DB:-sophia_document_workspace}
      DB_USERNAME: ${POSTGRES_USER:-sophia}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-sophia}
      REDIS_HOST: ${REDIS_HOST:-sophia-redis}
      REDIS_PORT: "${REDIS_PORT:-6379}"
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-sophia-kafka:9092}
      OPENSEARCH_HOST: ${OPENSEARCH_HOST:-sophia-opensearch}
      OPENSEARCH_PORT: "${OPENSEARCH_PORT:-9200}"
      S3_ENDPOINT: ${S3_ENDPOINT:-http://sophia-minio:9000}
      S3_BUCKET: ${DOCUMENT_WORKSPACE_S3_BUCKET:-sophia-document-workspace}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_PATH_STYLE_ACCESS: "true"
      JWT_JSON_WEB_KEY_SET_URI: ${JWT_JSON_WEB_KEY_SET_URI:-http://sophia-authentication-api:8080/.well-known/json-web-key-set.json}
      JWT_ISSUER: ${JWT_ISSUER:-sophia-authentication}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:3000}
      OTLP_TRACING_ENDPOINT: ${OTLP_TRACING_ENDPOINT:-http://sophia-tempo:4318/v1/traces}
      TRACING_SAMPLING_PROBABILITY: "${TRACING_SAMPLING_PROBABILITY:-0.1}"
      MONITORING_USERNAME: ${MONITORING_USERNAME:-prometheus}
      MONITORING_PASSWORD: ${MONITORING_PASSWORD:-prometheus}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health/liveness"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 1024M
        reservations:
          memory: 512M
    networks:
      - sophia

networks:
  sophia:
    external: true
