name: sophia-notification

services:
  notification-api:
    build: ../notification
    container_name: sophia-notification-api
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: "8082"
      DB_URL: jdbc:postgresql://${POSTGRES_HOST:-sophia-postgres}:${POSTGRES_PORT:-5432}/${NOTIFICATION_DB:-sophia_notification}
      DB_USERNAME: ${POSTGRES_USER:-sophia}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-sophia}
      REDIS_HOST: ${REDIS_HOST:-sophia-redis}
      REDIS_PORT: "${REDIS_PORT:-6379}"
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-sophia-kafka:9092}
      MAIL_HOST: ${MAIL_HOST:-sophia-mailhog}
      MAIL_PORT: "${MAIL_PORT:-1025}"
      EMAIL_ENABLED: ${EMAIL_ENABLED:-true}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@sophia.local}
      NOTIFICATION_COMMANDS_TOPIC: ${NOTIFICATION_COMMANDS_TOPIC:-sophia.notifications.commands}
      USER_EVENTS_TOPIC: ${USER_EVENTS_TOPIC:-sophia.authentication.user-events}
      USER_EVENTS_DEAD_LETTER_TOPIC: ${USER_EVENTS_DEAD_LETTER_TOPIC:-sophia.authentication.user-events.dlt}
      KAFKA_TOPIC_REPLICAS: "${KAFKA_TOPIC_REPLICAS:-1}"
      KAFKA_SECURITY_PROTOCOL: ${KAFKA_SECURITY_PROTOCOL:-PLAINTEXT}
      NOTIFICATION_COMMANDS_CONCURRENCY: "${NOTIFICATION_COMMANDS_CONCURRENCY:-3}"
      USER_EVENTS_CONCURRENCY: "${USER_EVENTS_CONCURRENCY:-2}"
      REDIS_SSL: "${REDIS_SSL:-false}"
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:4200}
      JWT_JSON_WEB_KEY_SET_URI: ${JWT_JSON_WEB_KEY_SET_URI:-http://sophia-authentication-api:8080/.well-known/json-web-key-set.json}
      JWT_ISSUER: ${JWT_ISSUER:-sophia-authentication}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:3000}
      OTLP_TRACING_ENDPOINT: ${OTLP_TRACING_ENDPOINT:-http://sophia-tempo:4318/v1/traces}
      TRACING_SAMPLING_PROBABILITY: "${TRACING_SAMPLING_PROBABILITY:-0.1}"
      MONITORING_USERNAME: ${MONITORING_USERNAME:-prometheus}
      MONITORING_PASSWORD: ${MONITORING_PASSWORD:-prometheus}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health/liveness"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.00"
          memory: 768M
        reservations:
          memory: 384M
    networks:
      - sophia

networks:
  sophia:
    external: true
