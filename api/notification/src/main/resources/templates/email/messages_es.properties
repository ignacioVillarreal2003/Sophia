layout.footer=Sophia — este es un mensaje automático, por favor no respondas.
layout.preferences=Administrar tus preferencias de notificación

security.email-verification.subject=Verificá tu dirección de email
security.email-verification.body=<p>Hola {name}:</p>\
  <p>¡Bienvenido a Sophia! Confirmá tu dirección de email haciendo clic en el enlace de abajo:</p>\
  <p><a href="{link}">Verificar mi email</a></p>\
  <p>El enlace vence en {ttlHours} horas. Si no creaste una cuenta, podés ignorar este mensaje.</p>

security.password-reset.subject=Restablecé tu contraseña
security.password-reset.body=<p>Hola {name}:</p>\
  <p>Recibimos un pedido para restablecer tu contraseña. Hacé clic en el enlace de abajo para elegir una nueva:</p>\
  <p><a href="{link}">Restablecer mi contraseña</a></p>\
  <p>El enlace vence en {ttlMinutes} minutos. Si no pediste el cambio, podés ignorar este mensaje.</p>

security.email-change-confirmation.subject=Confirmá tu nueva dirección de email
security.email-change-confirmation.body=<p>Hola {name}:</p>\
  <p>Confirmá que querés usar esta dirección para tu cuenta de Sophia:</p>\
  <p><a href="{link}">Confirmar nuevo email</a></p>\
  <p>Si no pediste este cambio, podés ignorar este mensaje.</p>

security.password-changed.subject=Se cambió tu contraseña
security.password-changed.body=<p>Hola {name}:</p>\
  <p>Se acaba de cambiar la contraseña de tu cuenta de Sophia. Si fuiste vos, no hace falta que hagas nada.</p>\
  <p>Si no la cambiaste, restablecela de inmediato y contactá a soporte.</p>

document-workspace.invitation.subject=Te invitaron a {workspaceName}
document-workspace.invitation.body=<p>Hola {name}:</p>\
  <p>{invitedBy} a unirte al espacio de trabajo <strong>{workspaceName}</strong> en Sophia.</p>\
  {messageBlock}\
  <p><a href="{link}">Aceptar invitación</a></p>\
  {expiryLine}
document-workspace.invitation.invited-by-someone={inviterName} te invitó
document-workspace.invitation.invited-by-nobody=Te invitaron
document-workspace.invitation.expiry=<p>Esta invitación vence el {expiresAt}.</p>

generic.notification.subject={title}
generic.notification.default-title=Tenés una notificación nueva
generic.notification.body=<p>Hola {name}:</p>\
  <p><strong>{title}</strong></p>\
  <p>{body}</p>\
  <p><a href="{link}">Abrir Sophia</a></p>
