layout.footer=Sophia — this is an automated message, please do not reply.
layout.preferences=Manage your notification preferences

security.email-verification.subject=Verify your email address
security.email-verification.body=<p>Hi {name},</p>\
  <p>Welcome to Sophia! Please confirm your email address by clicking the link below:</p>\
  <p><a href="{link}">Verify my email</a></p>\
  <p>This link expires in {ttlHours} hours. If you did not create an account, you can ignore this message.</p>

security.password-reset.subject=Reset your password
security.password-reset.body=<p>Hi {name},</p>\
  <p>We received a request to reset your password. Click the link below to choose a new one:</p>\
  <p><a href="{link}">Reset my password</a></p>\
  <p>This link expires in {ttlMinutes} minutes. If you did not request a reset, you can ignore this message.</p>

security.email-change-confirmation.subject=Confirm your new email address
security.email-change-confirmation.body=<p>Hi {name},</p>\
  <p>Please confirm that you want to use this address for your Sophia account:</p>\
  <p><a href="{link}">Confirm new email</a></p>\
  <p>If you did not request this change, you can ignore this message.</p>

security.password-changed.subject=Your password was changed
security.password-changed.body=<p>Hi {name},</p>\
  <p>Your Sophia account password was just changed. If this was you, no action is needed.</p>\
  <p>If you did not change your password, reset it immediately and contact support.</p>

document-workspace.invitation.subject=You have been invited to {workspaceName}
document-workspace.invitation.body=<p>Hi {name},</p>\
  <p>{invitedBy} to join the workspace <strong>{workspaceName}</strong> on Sophia.</p>\
  {messageBlock}\
  <p><a href="{link}">Accept invitation</a></p>\
  {expiryLine}
document-workspace.invitation.invited-by-someone={inviterName} invited you
document-workspace.invitation.invited-by-nobody=You have been invited
document-workspace.invitation.expiry=<p>This invitation expires on {expiresAt}.</p>

generic.notification.subject={title}
generic.notification.default-title=You have a new notification
generic.notification.body=<p>Hi {name},</p>\
  <p><strong>{title}</strong></p>\
  <p>{body}</p>\
  <p><a href="{link}">Open Sophia</a></p>
