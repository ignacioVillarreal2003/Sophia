name: AI CI

on:
  push:
    branches: [main]
    paths:
      - 'api/ai/**'
      - '.github/workflows/ai-ci.yml'
  pull_request:
    paths:
      - 'api/ai/**'
      - '.github/workflows/ai-ci.yml'

concurrency:
  group: ai-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: api/ai

permissions:
  contents: read

jobs:
  verify:
    name: Build, test and integration test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Verify
        run: ./mvnw -B --no-transfer-progress verify

      - name: Coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-jacoco
          path: api/ai/target/site/jacoco
          if-no-files-found: ignore

      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ai-test-reports
          path: |
            api/ai/target/surefire-reports
            api/ai/target/failsafe-reports
          if-no-files-found: ignore

  image:
    name: Container image
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t sophia-ai:${{ github.sha }} .

      - name: Scan image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: sophia-ai:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
