name: Authentication CI

on:
  push:
    branches: [main]
    paths:
      - "api/authentication/**"
      - ".github/workflows/authentication-ci.yml"
  pull_request:
    paths:
      - "api/authentication/**"
      - ".github/workflows/authentication-ci.yml"

permissions:
  contents: read
  packages: write

defaults:
  run:
    working-directory: api/authentication

jobs:
  build-and-test:
    name: Build, tests & coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build, unit + integration tests (Testcontainers), 80% coverage gate
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: api/authentication/target/site/jacoco
          if-no-files-found: ignore

      - name: Upload SBOM (CycloneDX)
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: api/authentication/target/bom.json
          if-no-files-found: warn

  dependency-scan:
    name: Dependency & config scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: api/authentication
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  docker-image:
    name: Docker build, scan & publish
    runs-on: ubuntu-latest
    needs: build-and-test
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/sophia-authentication
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t sophia-authentication:${{ github.sha }} .

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: sophia-authentication:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE_LOWERCASE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          docker tag sophia-authentication:${{ github.sha }} "$IMAGE_LOWERCASE:${{ github.sha }}"
          docker tag sophia-authentication:${{ github.sha }} "$IMAGE_LOWERCASE:latest"
          docker push "$IMAGE_LOWERCASE:${{ github.sha }}"
          docker push "$IMAGE_LOWERCASE:latest"

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [docker-image, dependency-scan]
    environment:
      name: production
      url: ${{ vars.PUBLIC_BASE_URL }}
    concurrency:
      group: authentication-production-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            IMAGE=$(echo "ghcr.io/${{ github.repository_owner }}/sophia-authentication" | tr '[:upper:]' '[:lower:]')
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull "$IMAGE:${{ github.sha }}"
            cd ${{ secrets.DEPLOY_COMPOSE_DIR }}
            AUTHENTICATION_IMAGE="$IMAGE:${{ github.sha }}" docker compose -f docker-compose.authentication.yml up -d
            docker image prune -f

  smoke-test:
    name: Post-deploy smoke test
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Wait for readiness
        run: |
          BASE_URL="${{ vars.PUBLIC_BASE_URL }}"
          for attempt in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BASE_URL/actuator/health/readiness" || true)
            if [ "$STATUS" = "200" ]; then
              echo "Service is ready (attempt $attempt)"
              exit 0
            fi
            echo "Attempt $attempt: readiness returned $STATUS; retrying in 10s"
            sleep 10
          done
          echo "Service never became ready" >&2
          exit 1

      - name: Verify core endpoints respond
        run: |
          BASE_URL="${{ vars.PUBLIC_BASE_URL }}"
          curl --fail -s "$BASE_URL/actuator/health/liveness" > /dev/null
          curl --fail -s "$BASE_URL/.well-known/json-web-key-set.json" > /dev/null
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$BASE_URL/v1/authentication/login" \
            -H "Content-Type: application/json" \
            -d '{"email":"smoke-test@invalid.local","password":"Wrong!Password1"}')
          if [ "$STATUS" != "401" ] && [ "$STATUS" != "400" ]; then
            echo "Login endpoint returned unexpected status $STATUS" >&2
            exit 1
          fi
          echo "Smoke test passed"
